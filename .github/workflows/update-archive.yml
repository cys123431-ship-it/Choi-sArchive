name: Update repository archive

on:
  workflow_dispatch:
  schedule:
    # 15:17 UTC = 00:17 KST on the following day.
    - cron: "17 15 * * *"
  push:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/update-archive.yml

permissions:
  contents: write

concurrency:
  group: repository-archive
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test archive safety and pagination
        run: python -m unittest discover -s .github/scripts -p 'test_build_archive.py' -v
      - name: Generate monthly index
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_OWNER: cys123431-ship-it
        run: python .github/scripts/build_archive.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md archive/
          if git diff --cached --quiet; then
            echo "No archive changes; no commit created."
            echo "No archive changes; no commit created." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Update repository archive by creation date"
            git push origin HEAD:main
            echo "Archive commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          fi
