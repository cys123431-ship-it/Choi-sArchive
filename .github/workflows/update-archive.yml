name: Update repository archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate monthly index
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_OWNER: cys123431-ship-it
        run: python .github/scripts/build_archive.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if ! git diff --cached --quiet; then
            git commit -m "Update repository archive by creation date"
            git push
          fi
